[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dataforge-ai"
version = "1.0.0"
description = "Production-Grade Web Intelligence & AI Extraction Platform"
requires-python = ">=3.12"
dependencies = ["psutil>=5.9.0"]

[tool.setuptools.packages.find]
where = ["backend"]
include = ["app*"]

[tool.mypy]
ignore_missing_imports = true
no_namespace_packages = true
explicit_package_bases = true
namespace_packages = true
disable_error_code = [
  "var-annotated",
  "arg-type",
  "return-value",
  "union-attr",
  "call-arg",
  "operator",
  "attr-defined",
  "override",
  "index",
]

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
skips = ["B101", "B110", "B311", "B403", "B404", "B603", "B607"]
