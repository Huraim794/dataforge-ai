version: "3.9"

services:
  postgres:
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dataforge}
      POSTGRES_USER: ${POSTGRES_USER:-dataforge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ${VOLUME_PREFIX:-./data}/postgres:/var/lib/postgresql/data
    restart: always

  redis:
    volumes:
      - ${VOLUME_PREFIX:-./data}/redis:/data
    restart: always

  api:
    environment:
      ENVIRONMENT: production
      LOG_LEVEL: INFO
      SECRET_KEY: ${SECRET_KEY}
      DATABASE_URL: "postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}"
      REDIS_URL: "redis://redis:6379/0"
      LLM_API_KEY: ${LLM_API_KEY}
      CAPTCHA_API_KEY: ${CAPTCHA_API_KEY:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
    restart: always

  worker:
    environment:
      ENVIRONMENT: production
      LOG_LEVEL: INFO
      SECRET_KEY: ${SECRET_KEY}
      DATABASE_URL: "postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}"
      REDIS_URL: "redis://redis:6379/0"
      LLM_API_KEY: ${LLM_API_KEY}
    deploy:
      replicas: ${WORKER_REPLICAS:-3}
    restart: always

  nginx:
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/api.conf:/etc/nginx/conf.d/api.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    restart: always
