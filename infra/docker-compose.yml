version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: dataforge
      POSTGRES_USER: dataforge
      POSTGRES_PASSWORD: dataforge
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dataforge"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  api:
    build:
      context: ../backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: "postgresql+asyncpg://dataforge:dataforge@postgres:5432/dataforge"
      DATABASE_SYNC_URL: "postgresql://dataforge:dataforge@postgres:5432/dataforge"
      REDIS_URL: "redis://redis:6379/0"
      REDIS_QUEUE_URL: "redis://redis:6379/1"
      REDIS_CACHE_URL: "redis://redis:6379/2"
      SECRET_KEY: "${SECRET_KEY:-dataforge-secret-key-change-in-production}"
      ENVIRONMENT: "${ENVIRONMENT:-production}"
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
      LLM_API_KEY: "${LLM_API_KEY:-}"
      LLM_PROVIDER: "${LLM_PROVIDER:-openai}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build:
      context: ../backend
      dockerfile: Dockerfile.worker
    environment:
      DATABASE_URL: "postgresql+asyncpg://dataforge:dataforge@postgres:5432/dataforge"
      DATABASE_SYNC_URL: "postgresql://dataforge:dataforge@postgres:5432/dataforge"
      REDIS_URL: "redis://redis:6379/0"
      REDIS_QUEUE_URL: "redis://redis:6379/1"
      REDIS_CACHE_URL: "redis://redis:6379/2"
      SECRET_KEY: "${SECRET_KEY}"
      ENVIRONMENT: "${ENVIRONMENT:-development}"
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
      LLM_API_KEY: "${LLM_API_KEY:-}"
    deploy:
      replicas: 2
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/api.conf:/etc/nginx/conf.d/api.conf:ro
    depends_on:
      - api
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
